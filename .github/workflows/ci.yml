name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gleam:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [erlang, javascript]
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.16"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: gleam format --check src test
      - run: gleam build --target ${{ matrix.target }}
      - run: gleam test --target ${{ matrix.target }}

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.16"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:browser
